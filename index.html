<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f7e2bd" />
<title>月饼拍拍乐 v4 · 游戏化版</title>
<style>
  :root{
    --ink:#4d2d20;
    --accent:#ef6a2d;
    --accent2:#b44826;
    --line:#e8cda6;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 10%, #fffdf5 0 12%, transparent 13%),
      radial-gradient(circle at 80% 0%, #ffe9bf 0 13%, transparent 14%),
      linear-gradient(180deg,#fff7e7,#f7e2bd);
    min-height:100vh;
  }
  header{padding:28px 20px 18px;text-align:center}
  h1{margin:0;font-size:clamp(30px,5vw,52px);letter-spacing:.06em}
  header p{margin:8px 0 0;opacity:.72}
  .wrap{width:min(1120px,94vw);margin:0 auto 48px}
  .tabs{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
  .tab{
    border:1px solid var(--line);
    background:#fff8ea;
    padding:11px 18px;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
    color:var(--ink);
  }
  .tab.active{
    color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:transparent;
    box-shadow:0 8px 22px rgba(191,74,35,.22);
  }
  .panel{display:none;grid-template-columns:360px 1fr;gap:20px;align-items:stretch}
  .panel.active{display:grid}
  .card{
    background:rgba(255,250,240,.95);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:0 18px 50px rgba(93,55,25,.12);
  }
  .controls{padding:20px}
  .controls h2{margin:0 0 10px;font-size:26px}
  .desc{font-size:14px;opacity:.72;line-height:1.6;margin-bottom:12px}
  .drop{
    display:block;
    border:2px dashed #dcb885;
    border-radius:18px;
    padding:16px;
    margin:12px 0;
    background:#fffdf8;
    cursor:pointer;
    text-align:center;
  }
  .drop:hover{background:#fff7ea}
  .drop input{display:none}
  .preview{
    width:100%;
    aspect-ratio:16/9;
    border-radius:14px;
    margin-top:10px;
    background:#f0dcc1;
    object-fit:cover;
    display:none;
  }
  button.action{
    width:100%;
    margin-top:12px;
    border:0;
    border-radius:16px;
    padding:14px 16px;
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 18px rgba(154,77,45,.24);
  }
  button.action.secondary{background:#8b765f}
  button.action.ghost{
    background:#fff7ec;
    color:#71462d;
    border:1px solid #ddbf96;
    box-shadow:none;
  }
  button.action:disabled{opacity:.45;cursor:not-allowed}
  .small{font-size:13px;line-height:1.6;opacity:.68;margin-top:12px}
  .progress{
    height:12px;
    border-radius:999px;
    background:#f0dfc7;
    overflow:hidden;
    margin-top:12px;
  }
  .progress > div{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ffbb54,#ef6a2d);
    transition:width .18s ease;
  }
  .stage{
    min-height:590px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)),
      repeating-linear-gradient(0deg,#ab6a3c 0 36px,#9e5f36 36px 72px);
  }
  .stage::after{
    content:"";
    position:absolute;
    left:10%;right:10%;bottom:42px;height:18px;
    background:rgba(81,44,25,.18);
    filter:blur(10px);
    border-radius:50%;
  }
  canvas{width:min(560px,94%);height:auto;position:relative;z-index:2;touch-action:none}
  .hint{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:3;
    background:#fff9;
    border:1px solid #e5caa1;
    padding:8px 12px;
    border-radius:999px;
    font-size:13px;
    white-space:nowrap;
  }
  .fx{
    position:absolute;
    pointer-events:none;
    z-index:5;
    font-size:42px;
    font-weight:900;
    color:#fff4d8;
    text-shadow:0 4px 12px rgba(87,36,12,.65);
    animation:pop .55s ease forwards;
  }
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(.45) rotate(-8deg);opacity:0}
    45%{transform:translate(-50%,-70%) scale(1.25) rotate(4deg);opacity:1}
    100%{transform:translate(-50%,-100%) scale(.9);opacity:0}
  }
  .mode2-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .footer{text-align:center;font-size:12px;opacity:.58;padding:10px 20px 28px}
  @media(max-width:820px){
    .panel{grid-template-columns:1fr}
    .stage{min-height:460px}
    .mode2-buttons{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <h1>🥮 月饼拍拍乐</h1>
  <p>v4：真的“拍”它、压扁它，再咬一口。</p>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-target="mode1">玩法一 · 拍成月饼</button>
    <button class="tab" data-target="mode2">玩法二 · 馅料 + 月饼皮</button>
  </div>

  <section id="mode1" class="panel active">
    <div class="card controls">
      <h2>真的拍扁它</h2>
      <div class="desc">上传图片后，连续点击右侧图片。每拍一下，它都会更扁一点，直到变成月饼。</div>
      <label class="drop">
        <strong>上传一张图片</strong>
        <input id="img1" type="file" accept="image/*">
        <img id="prev1" class="preview" alt="">
      </label>
      <button id="autoSmash" class="action" disabled>👋 自动连拍</button>
      <div class="progress"><div id="smashProgress"></div></div>
      <button id="download1" class="action ghost" disabled>⬇ 保存成品 PNG</button>
      <button id="reset1" class="action secondary">↻ 重新来</button>
      <div class="small">也可以直接用鼠标 / 手指点击右侧画面进行拍打。</div>
    </div>
    <div class="card stage" id="stage1">
      <div class="hint">上传图片后，点击画面拍它</div>
      <canvas id="canvas1" width="700" height="560"></canvas>
    </div>
  </section>

  <section id="mode2" class="panel">
    <div class="card controls">
      <h2>做夹心月饼</h2>
      <div class="desc">第一张图做馅，第二张图做整块月饼主体。做好后点击“咬一口”。</div>
      <label class="drop">
        <strong>① 上传馅料图片</strong>
        <input id="fillingInput" type="file" accept="image/*">
        <img id="fillingPrev" class="preview" alt="">
      </label>
      <label class="drop">
        <strong>② 上传月饼主体图片</strong>
        <input id="skinInput" type="file" accept="image/*">
        <img id="skinPrev" class="preview" alt="">
      </label>
      <button id="makeBtn" class="action" disabled>✨ 做成夹心月饼</button>
      <div class="mode2-buttons">
        <button id="biteBtn" class="action" disabled>🌙 咔嚓！咬一口</button>
        <button id="download2" class="action ghost" disabled>⬇ 保存成品</button>
      </div>
      <button id="reset2" class="action secondary">↻ 重新来</button>
    </div>
    <div class="card stage" id="stage2">
      <div class="hint">做好后，点击“咬一口”</div>
      <canvas id="canvas2" width="700" height="560"></canvas>
    </div>
  </section>
</div>

<div class="footer">Mooncake Patter v4 · Gameplay Edition</div>

<script>
const $ = s => document.querySelector(s);
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    $('#'+btn.dataset.target).classList.add('active');
  });
});

function loadFile(input, preview, cb){
  input.addEventListener('change',()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    preview.src=url;
    preview.style.display='block';
    const img=new Image();
    img.onload=()=>cb(img);
    img.src=url;
  });
}
function coverDraw(ctx,img,x,y,w,h){
  const ir=img.width/img.height, rr=w/h;
  let sx=0,sy=0,sw=img.width,sh=img.height;
  if(ir>rr){ sw=img.height*rr; sx=(img.width-sw)/2; }
  else{ sh=img.width/rr; sy=(img.height-sh)/2; }
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function ellipsePath(ctx,cx,cy,rx,ry){
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
}
function addBakeFusion(ctx,x,y,w,h){
  ctx.fillStyle='rgba(215,132,54,.18)'; ctx.fillRect(x,y,w,h);
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'rgba(255,240,210,.07)');
  g.addColorStop(.55,'rgba(165,88,38,.10)');
  g.addColorStop(1,'rgba(70,32,15,.25)');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
}
function drawDecor(ctx,cx,cy,scale=1){
  ctx.save();
  ctx.strokeStyle='rgba(86,39,18,.20)';
  ctx.lineWidth=3*scale;
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    ctx.beginPath();
    ctx.ellipse(cx+Math.cos(a)*148*scale,cy+Math.sin(a)*118*scale,16*scale,10*scale,a,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}
function drawCake(ctx,img,flatten=1,bitten=false,filling=null){
  const cx=350, cy=290;
  const rx=210;
  const ry=178*flatten;
  ctx.clearRect(0,0,700,560);

  // shadow
  ctx.fillStyle='rgba(76,42,21,.24)';
  ctx.beginPath(); ctx.ellipse(cx,cy+170,195,28,0,0,Math.PI*2); ctx.fill();

  // side body
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx,cy+38,rx,Math.max(75,ry),0,0,Math.PI*2); ctx.clip();
  coverDraw(ctx,img,cx-rx,cy-ry-15,rx*2,ry*2+70);
  addBakeFusion(ctx,cx-rx,cy-ry-15,rx*2,ry*2+70);
  ctx.restore();

  // top
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx,cy-20,rx-10,ry-10,0,0,Math.PI*2); ctx.clip();
  coverDraw(ctx,img,cx-rx,cy-20-ry,rx*2,ry*2);
  addBakeFusion(ctx,cx-rx,cy-20-ry,rx*2,ry*2);
  ctx.restore();

  // border + decorative stamp
  ctx.strokeStyle='rgba(255,232,185,.82)';
  ctx.lineWidth=7;
  ctx.beginPath();ctx.ellipse(cx,cy-20,rx-15,ry-15,0,0,Math.PI*2);ctx.stroke();
  drawDecor(ctx,cx,cy-20,Math.max(.62,flatten));

  // side ridges
  for(let i=0;i<38;i++){
    const a=i/38*Math.PI*2;
    const x=cx+Math.cos(a)*rx*.985;
    const y=cy+Math.sin(a)*Math.max(88,ry*.98)+8;
    ctx.fillStyle='rgba(120,60,22,.25)';
    ctx.beginPath();ctx.ellipse(x,y,15,12,a,0,Math.PI*2);ctx.fill();
  }

  if(bitten && filling){
    ctx.save();
    ctx.globalCompositeOperation='destination-out';
    [[492,145,56],[536,180,52],[525,232,48]].forEach(([x,y,r])=>{
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(448,114);
    ctx.quadraticCurveTo(550,145,565,252);
    ctx.quadraticCurveTo(513,288,466,248);
    ctx.closePath();
    ctx.clip();
    coverDraw(ctx,filling,430,110,152,170);
    const fg=ctx.createLinearGradient(430,110,585,280);
    fg.addColorStop(0,'rgba(255,255,255,.09)');
    fg.addColorStop(1,'rgba(80,38,22,.25)');
    ctx.fillStyle=fg;ctx.fillRect(430,110,152,170);
    ctx.restore();

    ctx.strokeStyle='rgba(240,222,192,.95)';
    ctx.lineWidth=9;
    [[492,145,54],[535,180,50],[525,232,46]].forEach(([x,y,r])=>{
      ctx.beginPath();ctx.arc(x,y,r,.95*Math.PI,1.95*Math.PI);ctx.stroke();
    });

    ctx.fillStyle='rgba(115,60,30,.72)';
    [[560,250,7],[586,275,5],[536,312,6],[610,241,4],[585,224,3]].forEach(([x,y,r])=>{
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    });
  }
}

function spawnFx(stage,text,x=.5,y=.45){
  const el=document.createElement('div');
  el.className='fx';
  el.textContent=text;
  el.style.left=(x*100)+'%';
  el.style.top=(y*100)+'%';
  stage.appendChild(el);
  setTimeout(()=>el.remove(),650);
}
function downloadCanvas(canvas,name){
  const a=document.createElement('a');
  a.download=name;
  a.href=canvas.toDataURL('image/png');
  a.click();
}

// Mode 1
let img1=null;
let hitCount=0;
const maxHits=6;
loadFile($('#img1'),$('#prev1'),img=>{
  img1=img; hitCount=0;
  $('#autoSmash').disabled=false;
  $('#download1').disabled=true;
  $('#smashProgress').style.width='0%';
  drawCake($('#canvas1').getContext('2d'),img1,1.08,false);
});
function hit(){
  if(!img1 || hitCount>=maxHits) return;
  hitCount++;
  const p=hitCount/maxHits;
  const flatten=1.08 - p*.48;
  drawCake($('#canvas1').getContext('2d'),img1,flatten,false);
  $('#smashProgress').style.width=(p*100)+'%';
  spawnFx($('#stage1'),hitCount===maxHits?'🥮 完成！':'啪！',
          .48+Math.random()*.08,.38+Math.random()*.12);
  if(hitCount===maxHits){
    $('#download1').disabled=false;
  }
}
$('#canvas1').addEventListener('pointerdown',hit);
$('#autoSmash').onclick=()=>{
  if(!img1)return;
  let i=0;
  const t=setInterval(()=>{
    hit(); i++;
    if(i>=maxHits || hitCount>=maxHits) clearInterval(t);
  },180);
};
$('#download1').onclick=()=>downloadCanvas($('#canvas1'),'my-mooncake.png');
$('#reset1').onclick=()=>{
  img1=null;hitCount=0;
  $('#img1').value='';$('#prev1').style.display='none';
  $('#autoSmash').disabled=true;$('#download1').disabled=true;
  $('#smashProgress').style.width='0%';
  $('#canvas1').getContext('2d').clearRect(0,0,700,560);
};

// Mode 2
let filling=null,skin=null,made=false,bitten=false;
function updateMake(){ $('#makeBtn').disabled=!(filling&&skin); }
loadFile($('#fillingInput'),$('#fillingPrev'),img=>{filling=img;updateMake();});
loadFile($('#skinInput'),$('#skinPrev'),img=>{skin=img;updateMake();});
$('#makeBtn').onclick=()=>{
  made=true;bitten=false;
  $('#biteBtn').disabled=false;$('#download2').disabled=false;
  drawCake($('#canvas2').getContext('2d'),skin,.78,false,filling);
  spawnFx($('#stage2'),'包好啦！',.5,.38);
};
$('#biteBtn').onclick=()=>{
  if(!made)return;
  bitten=!bitten;
  drawCake($('#canvas2').getContext('2d'),skin,.78,bitten,filling);
  $('#biteBtn').textContent=bitten?'↩ 恢复完整月饼':'🌙 咔嚓！咬一口';
  spawnFx($('#stage2'),bitten?'咔嚓！':'复原！',.72,.34);
};
$('#download2').onclick=()=>downloadCanvas($('#canvas2'),'stuffed-mooncake.png');
$('#reset2').onclick=()=>{
  filling=null;skin=null;made=false;bitten=false;
  $('#fillingInput').value='';$('#skinInput').value='';
  $('#fillingPrev').style.display='none';$('#skinPrev').style.display='none';
  $('#makeBtn').disabled=true;$('#biteBtn').disabled=true;$('#download2').disabled=true;
  $('#biteBtn').textContent='🌙 咔嚓！咬一口';
  $('#canvas2').getContext('2d').clearRect(0,0,700,560);
};
</script>
</body>
</html>
